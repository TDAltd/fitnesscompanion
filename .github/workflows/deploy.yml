name: Build & deploy to Namecheap

# Runs on every push to main, and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels an older one still running.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Read the secret into an env var so we can skip the upload step when it isn't set yet
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      # The folder the app is served from: https://tdaproducthub.com/fitnesscompanion/
      # Use "/" if the app ever moves to its own domain or subdomain.
      BASE_PATH: /fitnesscompanion/

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for code errors
        run: pnpm run typecheck

      - name: Build the app
        run: pnpm run build

      - name: Add restart marker
        # Passenger (the engine behind cPanel's "Setup Node.js App") restarts the app
        # when tmp/restart.txt changes, so a new upload goes live without clicking Restart.
        run: |
          mkdir -p deploy/tmp
          echo "${{ github.sha }} $(date -u +%FT%TZ)" > deploy/tmp/restart.txt

      - name: Clean up FTP server name
        id: ftp
        if: env.FTP_SERVER != ''
        # Accepts "ftp://host/", "host:21", stray spaces etc. and keeps just the hostname
        run: |
          host="$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#[/:].*$##')"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          if ! getent hosts "$host" > /dev/null; then
            echo "::error::The FTP_SERVER secret ('$host') is not a real server name. Use the server hostname from cPanel, e.g. server123.web-hosting.com"
            exit 1
          fi
          echo "FTP server: $host"

      - name: Upload to Namecheap
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          # Folder on the server, relative to where the FTP account lands. "./" when the
          # FTP account is locked to the app folder (recommended), e.g. "fitness-app/" otherwise.
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          # Only changed files are uploaded. Files that only exist on the server
          # (logs, node_modules made by cPanel) are left alone.
          exclude: |
            **/.env
            **/.env.example

      - name: Upload skipped
        if: env.FTP_SERVER == ''
        run: echo "::warning::FTP secrets are not set yet, so the app was built and checked but not uploaded. See README > Automatic deployment."
