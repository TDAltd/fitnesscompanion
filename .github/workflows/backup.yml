name: Nightly database backup

# Every night at 02:17 Lagos time (01:17 UTC) this asks the live app for a full, password-locked
# backup and keeps it here for 14 days (Actions tab → this workflow → a run → Artifacts).
# Needs one repository secret: BACKUP_KEY (copy it from Admin → Backups in the app).
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: https://tdaproducthub.com/fitnesscompanion
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
    steps:
      - name: Check the key is set
        run: |
          if [ -z "$BACKUP_KEY" ]; then
            echo "::error::Add the BACKUP_KEY secret: copy it from Admin → Backups, then GitHub → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - name: Download tonight's backup
        run: |
          name="fitness-companion-$(date -u +%Y-%m-%d).fcbk"
          code=$(curl -sS --retry 3 --retry-delay 20 --max-time 600 -H "x-backup-key: $BACKUP_KEY" \
            -o "$name" -w "%{http_code}" "$APP_URL/api/cron/backup")
          if [ "$code" != "200" ]; then
            echo "::error::The app answered $code."; head -c 300 "$name"; exit 1
          fi
          if [ "$(head -c 5 "$name")" != "FCBK1" ]; then
            echo "::error::That isn't a backup file."; head -c 300 "$name"; exit 1
          fi
          echo "Saved $name ($(du -h "$name" | cut -f1))"
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"

      - name: Keep it for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
